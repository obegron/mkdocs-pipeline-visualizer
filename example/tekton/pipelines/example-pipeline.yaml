apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    app.kubernetes.io/version: "0.2"
  name: example-pipeline
spec:
  displayName: Build, test, and publish
  description: |
    Fetch the source, run lint checks, and then build and test in parallel.
    Publish only after both checks complete. Final tasks handle cleanup and
    notification after the main tasks settle, even when a task fails.
  results:
    - name: build-summary
      description: Summary produced by the publishing task.
      value: $(tasks.build-push-image.results.MY_RESULT)
  params:
    - name: parameter1
      description: source repo 1
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-repository
      taskRef:
        name: example-tasks
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: parameter1
          value: $(params.parameter1)
    - name: run-lint
      taskRef:
        name: example-tasks
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - fetch-repository
    - name: build-test
      taskRef:
        name: example-tasks
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - run-lint
    - name: unit-test
      taskRef:
        name: example-tasks
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - run-lint
    - name: build-push-image
      taskRef:
        name: example-tasks
      runAfter:
        - unit-test
        - build-test
      workspaces:
        - name: source
          workspace: shared-workspace
  finally:
    - name: done
      taskRef:
        name: example-tasks
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: notify
      taskRef:
        name: example-tasks
      workspaces:
        - name: source
          workspace: shared-workspace
