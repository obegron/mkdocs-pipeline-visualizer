[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-pipeline-visualizer"
version = "0.4.2"
description = "Generate MkDocs documentation from Tekton pipelines, tasks, and stepactions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christer Gronblad" },
]
requires-python = ">=3.10"
dependencies = [
  "mkdocs>=1.6.1,<2",
  "packaging",
  "PyYAML",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: MkDocs",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/obegron/mkdocs-pipeline-visualizer"
Repository = "https://github.com/obegron/mkdocs-pipeline-visualizer"
Issues = "https://github.com/obegron/mkdocs-pipeline-visualizer/issues"

[project.entry-points."mkdocs.plugins"]
pipeline-visualizer = "mkdocs_pipeline_visualizer.visualizer:PipelineVisualizer"

[project.scripts]
serve-example = "mkdocs_pipeline_visualizer.dev:serve_example"
test = "mkdocs_pipeline_visualizer.dev:run_tests"

[dependency-groups]
dev = [
  "build",
  "mkdocs-materialx",
  "plantuml-markdown",
  "pymdown-extensions",
  "pytest",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
