site_name: Tekton catalog
site_description: Explore pipeline execution, task interfaces, and reusable steps.
docs_dir: ./tekton

nav:
  - Home: index.md
  - Tekton:
    - "🚀 Pipelines": []  
    - "🛠️ Tasks": []
    - "⚙️ StepActions": []

plugins:
  - search
  - pipeline-visualizer:
      plantuml_theme: _none_
      nav_hide_empty_sections: true
      nav_section_tasks: "🛠️ Tasks"
      nav_section_pipelines: "🚀 Pipelines"
      nav_section_stepactions: "⚙️ StepActions"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      line_spans: __span
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - plantuml_markdown:
      server: https://www.plantuml.com/plantuml
      format: svg

theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
